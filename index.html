<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Allure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="toprt">
      <div class="langsel"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
      <button id="themeBtn" class="theme-toggle"></button>
    </div>
  </div>
  <h1>Allure</h1>
  <div class="event" id="event"></div>
  <div class="route" id="route"></div>
  <div class="hdr-actions" id="hdrActions" style="display:none"><button class="actbtn cfgbtn" id="cfgBtn"></button></div>
  <div class="banner" id="fileBanner" style="display:none" data-i18n="fileHint">Ouvre cette page via un serveur web (ex. <code>python3 -m http.server</code>) : les modules ne se chargent pas depuis un fichier local.</div>

  <div class="profile" id="profile" style="display:none"><div class="prof-cap" id="profcap"></div>
    <div class="prof-ctrls"><button class="prof-tog" id="profFount"></button></div>
    <div class="prof-plot" id="profPlot">
    <svg viewBox="0 0 1000 320" preserveAspectRatio="none" role="img" aria-label="profil" id="profSvg"></svg>
    <div class="prof-cross" id="profCross"></div><div class="prof-dot" id="profDot"></div><div class="prof-tip" id="profTip"></div>
    </div>
    <div class="prof-axis" id="profAxis"></div>
  </div>
  <div class="mapwrap" id="mapWrap" style="display:none"><div id="map"></div></div>

  <div class="wxbar" id="wxSumPanel" style="display:none">
    <div class="wxbar-head"><span class="wxbar-t" id="wxSumTitle"></span><span class="wxbar-r"><span id="wxSumUpd"></span><button id="wxSumRefresh"></button><button class="wxlink" id="wxSumDetail"></button></span></div>
    <div class="wx-msg" id="wxSumMsg"></div>
    <div id="wxSumBody"></div>
  </div>

  <div class="empty" id="viewEmpty" style="display:none"><h2 id="emptyTitle"></h2><p id="emptyText"></p><div id="emptyZone"></div></div>

  <div class="tabs"><button class="tab" data-tab="plan" aria-pressed="true" id="tabPlan"></button><button class="tab" data-tab="nutri" id="tabNutri"></button><button class="tab" data-tab="weather" id="tabWx"></button><button class="tab" data-tab="check" id="tabCheck"></button></div>

  <div id="viewPlan">
  <div class="panel">
    <div class="panel-title" id="dataTitle"></div>
    <div class="fields3">
      <div><label id="labFtp"></label><div class="inp"><input id="ftp" type="number" inputmode="numeric" value="250" min="100" max="500"><span class="unit">w</span></div></div>
      <div><label id="labKg"></label><div class="inp"><input id="kg" type="number" inputmode="numeric" value="75" min="40" max="130"><span class="unit">kg</span></div></div>
      <div><label id="labStart"></label><div class="inp"><input id="start" type="time" value="07:00"></div></div>
    </div>
    <div style="margin-top:16px"><label id="goalTitle"></label>
      <div class="obj" id="obj">
        <button data-o="chill"><span id="o1"></span><small id="o1s"></small></button>
        <button data-o="diesel" aria-pressed="true"><span id="o2"></span><small id="o2s"></small></button>
        <button data-o="perf"><span id="o3"></span><small id="o3s"></small></button>
        <button data-o="adv"><span id="o4"></span><small id="o4s"></small></button>
      </div>
      <div id="advWrap" style="display:none;margin-top:14px">
        <div class="slider-row"><div class="shead"><span class="slabel" id="advLabel"></span><span class="sval"><span id="advVal">75</span> <small id="advUnit"></small></span></div><input type="range" id="advRange" min="58" max="85" step="1" value="75"></div>
        <div class="nutri-sub" id="advReco" style="margin:8px 0 0"></div>
      </div>
    </div>
    <details class="adv"><summary id="advMore"></summary>
      <div class="sliders">
        <div class="slider-row"><div class="shead"><span class="slabel" id="labFlatIF"></span><span class="sval"><span id="flatIFV">62</span> <small>% FTP</small></span></div><input type="range" id="flatIF" min="45" max="80" step="1" value="62"></div>
        <div class="slider-row"><div class="shead"><span class="slabel" id="labDraft"></span><span class="sval"><span id="draftV">20</span> <small>%</small></span></div><input type="range" id="draft" min="0" max="40" step="5" value="20"><div class="hint" id="draftHint"></div></div>
        <div class="slider-row"><div class="shead"><span class="slabel" id="labDescCap"></span><span class="sval"><span id="descCapV">48</span> <small>km/h</small></span></div><input type="range" id="descCap" min="35" max="60" step="1" value="48"></div>
      </div>
    </details>
  </div>

  <div class="results">
    <div class="total"><div class="big" id="totalTime">…</div><div class="meta" id="totalMeta"></div></div>
    <div class="timeline" id="timeline"></div>
  </div>
  <div class="foot" id="foot"></div>
  </div>

  <div id="viewNutri" style="display:none">
    <div class="panel">
      <div class="panel-title" id="nutTitle"></div>
      <div class="nutri-sub" id="nutSub"></div>
      <div class="fields3">
        <div><label id="labGph"></label><div class="inp"><input id="gph" type="number" inputmode="numeric" value="75" min="20" max="120"><span class="unit">g/h</span></div></div>
        <div><label id="labGel"></label><div class="inp"><input id="gGel" type="number" inputmode="numeric" value="45" min="5" max="80"><span class="unit">g</span></div></div>
        <div><label id="labBidon"></label><div class="inp"><input id="gBidon" type="number" inputmode="numeric" value="40" min="0" max="150"><span class="unit">g</span></div></div>
        <div><label id="labBsize"></label><div class="inp"><input id="bsize" type="number" inputmode="decimal" value="0.6" min="0.3" max="1.2" step="0.05"><span class="unit">L</span></div></div>
      </div>
      <div style="margin-top:16px"><label id="nutIsoTitle"></label>
        <div class="slider-row"><div class="shead"><span class="slabel" id="nutIsoLab"></span><span class="sval"><span id="isoPctV">50</span> %</span></div><input type="range" id="isoPct" min="0" max="100" step="10" value="50"></div>
      </div>
      <div style="margin-top:14px"><label id="nutRvTitle"></label>
        <div class="nsel" id="nutRv"><button data-rv="ravitos" id="rv1"></button><button data-rv="autonome" id="rv2"></button></div>
      </div>
      <div class="nblock"><div class="nblock-t" id="nutRatesT"></div><div id="nutRates"></div></div>
      <div class="nblock"><div class="nblock-t" id="nutCarryT"></div><div id="nutCarry"></div></div>
      <div class="nblock"><div class="nblock-t" id="nutPlanT"></div><div id="nutPlan"></div></div>
      <div class="gauge-wrap"><div class="sodium" id="sodium"></div><div class="wxnote" id="wxNote"></div></div>
    </div>
  </div>
  <div id="viewWeather" style="display:none">
    <div class="panel" id="wxPanel">
      <div class="wx-head">
        <div><div class="panel-title" id="wxTitle" style="margin-bottom:5px"></div><div class="nutri-sub" id="wxSub" style="margin:0"></div></div>
        <div class="wx-upd"><span id="wxUpd"></span><button id="wxRefresh"></button></div>
      </div>
      <div class="wx-msg" id="wxMsg"></div>
      <div class="wxgrid" id="wxGrid"></div>
    </div>
  </div>
  <div id="viewCheck" style="display:none">
    <div class="panel"><div class="panel-title" id="chkTitle"></div><div class="nutri-sub" id="chkIntro"></div><div id="chkList"></div><div style="margin-top:16px"><button class="actbtn" id="chkReset"></button></div></div>
  </div>
  <div class="version" id="version"></div>
</div>

<div class="actionbar" id="actionBar" style="display:none">
  <div class="actionbar-inner">
    <button class="actbtn prim" id="pdfBtn"></button>
    <button class="actbtn" id="stickerBtn"></button>
    <button class="actbtn" id="gpxBtn"></button>
    <button class="actbtn" id="cfgBtn2"></button>
  </div>
</div>

<div class="modal" id="stickerModal"><div class="sheet wide">
  <button class="close" id="mClose"></button>
  <h3 id="mTitle"></h3><p class="hint" id="mHint"></p>
  <div class="st-ctrl">
    <div class="st-orient"><button data-so="portrait" id="soP"></button><button data-so="landscape" id="soL"></button></div>
    <label class="st-size"><span id="stSizeLab"></span> <input type="number" id="stSize" min="25" max="55" value="38"> mm</label>
  </div>
  <div class="sticker-print" id="stickerContent"></div>
  <div style="text-align:center;margin-top:14px"><button class="actbtn prim" id="stickerPdfBtn"></button></div>
</div></div>

<div class="modal" id="cfgModal"><div class="sheet wide dark">
  <button class="close" id="cfgClose"></button>
  <h3 id="cfgTitle"></h3>
  <div id="cfgBody"></div>
</div></div>

<div class="modal" id="gpxModal"><div class="sheet">
  <button class="close" id="gxClose"></button>
  <h3 id="gxTitle"></h3><p class="hint" id="gxHint"></p>
  <div class="gx-dev" id="gxDev"><button data-dev="coros">Coros</button><button data-dev="wahoo">Wahoo</button><button data-dev="garmin">Garmin</button><button data-dev="hammerhead">Hammerhead</button><button data-dev="autre" id="gxAutre"></button></div>
  <div class="gx-note" id="gxNote"></div>
  <div class="gx-fount"><button id="gxFount" aria-pressed="false"></button></div>
  <div class="gx-msg" id="gxMsg"></div>
  <div style="text-align:center;margin-top:16px"><button class="actbtn prim" id="gxDl"></button></div>
</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
